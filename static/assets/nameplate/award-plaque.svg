      <stop offset=".49" stop-color="#ab7834"/><stop offset=".55" stop-color="#fff1b7"/>
      <stop offset="1" stop-color="#946328"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="118" x2="570" y2="-68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c59a54"/><stop offset=".13" stop-color="#e8c98b"/>
      <stop offset=".27" stop-color="#f8e5b2"/><stop offset=".32" stop-color="#fff1cb"/>
      <stop offset=".43" stop-color="#e9ca8d"/><stop offset=".59" stop-color="#ddb979"/>
      <stop offset=".76" stop-color="#f2dba5"/><stop offset=".82" stop-color="#fff0c5"/>
      <stop offset="1" stop-color="#cfaa67"/>
    </linearGradient>
    <linearGradient id="polish" x2="0" y2="1">
